name: Keep database awake

# Supabase's free tier pauses a project after 7 days with no activity.
# This pings /health/db (which runs a real "SELECT 1") every 3 days.
on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend database health endpoint
        run: |
          curl -fsS --retry 5 --retry-delay 30 --retry-all-errors --max-time 120 \
            https://ca-practiceos-backend.onrender.com/health/db
